name: Release

# Triggered on every push to main.
# release-please opens / updates a "Release PR" automatically.
# Merging that PR creates the git tag and GitHub Release.
# The Terraform Registry picks up the tag via its GitHub webhook.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # release-please: manages CHANGELOG, bumps version, creates tag + release
  # -------------------------------------------------------------------------
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # release-please-config.json controls bump strategy
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # -------------------------------------------------------------------------
  # Post-release validation: re-validate the tagged commit before announcing
  # -------------------------------------------------------------------------
  validate-release:
    name: validate release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Validate root module
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate examples
        run: |
          for dir in examples/*/; do
            echo "==> Validating $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Run tests
        run: |
          terraform init -backend=false
          terraform test

  # -------------------------------------------------------------------------
  # Notify: add a summary comment to the release
  # -------------------------------------------------------------------------
  notify:
    name: annotate release
    needs: [release-please, validate-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Add Terraform Registry link to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          append_body: true
          body: |

            ---
            **Terraform Registry**: `openobserve/openobserve/kubernetes` version `${{ needs.release-please.outputs.version }}`

            ```hcl
            module "openobserve" {
              source  = "openobserve/openobserve/kubernetes"
              version = "~> ${{ needs.release-please.outputs.version }}"
            }
            ```
